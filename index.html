<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocorrências Em Trânsito - Gertaxi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.css" />
    <style>
        body, html, #root {
            margin: 0; padding: 0; height: 100%; background-color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.0/build/stlite.js"></script>
    <script>
        stlite.mount({
            idbfsMountpoints: ["/data"],
            requirements: ["requests"], // <- Removido "supabase" para evitar o erro do Pydantic
            entrypoint: "app.py",
            files: {
                "app.py": {
                    url: "app.py"
                }
            }
        }, document.getElementById("root"));
    </script>
</body>
</html>
